# Publish @enclave-technologies/secure-storage to npm on GitHub Release (tag e.g. v0.1.0).
# Requires @enclave-technologies/pqc-primitives on npm first.
# Requires one-time manual first publish, then npm Trusted Publisher (OIDC).

name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org

      - run: npm install -g npm@latest

      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: Publish to npm (OIDC Trusted Publishing)
        run: npm publish --access public --provenance
